version: 2.1

orbs:
  node: circleci/node@5.1.0
  vercel: circleci/vercel@0.0.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project

jobs:
  install-and-cache:
    executor: node-executor
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/.npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run ESLint
          command: npm run lint
      - run:
          name: Type Check
          command: npx tsc --noEmit

  build:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build Next.js Application
          command: npm run build
          environment:
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            R2R_BASE_URL: ${R2R_BASE_URL}
      - persist_to_workspace:
          root: .
          paths:
            - .next

  security-scan:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run npm audit
          command: npm audit --audit-level=moderate || true
      - run:
          name: Install Snyk
          command: npm install -g snyk
      - run:
          name: Run Snyk Security Scan
          command: snyk test --severity-threshold=high || true
          environment:
            SNYK_TOKEN: ${SNYK_TOKEN}

  deploy-production:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel
      - run:
          name: Deploy to Vercel Production
          command: |
            vercel pull --yes --environment=production --token=${VERCEL_TOKEN}
            vercel build --prod --token=${VERCEL_TOKEN}
            vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN}

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - install-and-cache
      - lint:
          requires:
            - install-and-cache
      - build:
          requires:
            - install-and-cache
      - security-scan:
          requires:
            - install-and-cache
      - deploy-production:
          requires:
            - lint
            - build
            - security-scan
          filters:
            branches:
              only: main
