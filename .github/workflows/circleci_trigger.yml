name: Trigger CircleCI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  trigger_circleci:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CircleCI Pipeline
        uses: CircleCI-Public/trigger-circleci-pipeline-action@v1.0.0
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
        with:
          # Replace with your CircleCI project slug (e.g., "gh/my-org/my-repo")
          # This can be found in your CircleCI project settings
          project-slug: ${{ secrets.CIRCLECI_PROJECT_SLUG }}
          branch: ${{ github.head_ref || github.ref_name }}
          # Optional: Pass parameters to the CircleCI pipeline
          # parameters: '{ "run-e2e-tests": true }'
