# .github/config/pr-automation.yml
# Configuration for PR Metadata Automation

reviewers:
  - evgenygurin # Repository owner
  # Add more reviewers here

default_assignee: evgenygurin # Default assignee

project_id: 'PVT_xxx' # Your GitHub Project ID (get from project settings). Set to null or remove to disable.

milestone_map:
  'v1.0': 'MVP Release'
  'v1.1': 'Feature Update 1.1'
  'hotfix': 'Hotfixes'
  'default': 'Next Release'

label_patterns:
  branch:
    'claude/': ['claude-agent', 'automated']
    'feature/': ['feature', 'enhancement']
    'feat/': ['feature', 'enhancement'] # Added 'feat/' for conventional commits
    'fix/': ['bug', 'bugfix']
    'hotfix/': ['hotfix', 'urgent']
    'docs/': ['documentation']
    'test/': ['tests']
    'refactor/': ['refactoring']
    'chore/': ['maintenance']
    'build/': ['build'] # Added build label
    'ci/': ['ci'] # Added ci label
    'perf/': ['performance'] # Added perf label
    'revert/': ['revert'] # Added revert label
    'style/': ['style'] # Added style label
  content_keywords:
    'breaking change': 'breaking-change'
    'security': 'security'
    'performance': 'performance'
    'api': 'api'
    'database': 'database'
    'ui': 'ui'
    'ux': 'ux'
    'graphql': 'graphql' # Added graphql label
    'rest': 'api' # Added rest label
    'frontend': 'ui' # Added frontend label
    'backend': 'backend' # Added backend label
    'docs': 'documentation' # Added docs label
    'test': 'tests' # Added test label
  file_extensions:
    '.js': ['javascript', 'frontend']
    '.jsx': ['javascript', 'frontend', 'react']
    '.ts': ['typescript', 'backend']
    '.tsx': ['typescript', 'frontend', 'react']
    '.py': ['python', 'backend']
    '.go': ['go', 'backend']
    '.java': ['java', 'backend']
    '.cs': ['csharp', 'backend']
    '.php': ['php', 'backend']
    '.rb': ['ruby', 'backend']
    '.md': ['documentation']
    '.yml': ['configuration', 'ci']
    '.yaml': ['configuration', 'ci']
    '.json': ['configuration']
    '.html': ['frontend']
    '.css': ['frontend', 'styling']
    '.scss': ['frontend', 'styling']
    '.less': ['frontend', 'styling']
    '.sql': ['database']
    '.graphql': ['graphql']

