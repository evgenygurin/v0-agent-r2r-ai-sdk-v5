# Linear Issue Template: CI/CD Failure
# Auto-created by self-healing CI system

name: CI/CD Failure
description: Automated issue creation for CI/CD pipeline failures

# Issue fields
issue:
  priority: 1  # Urgent
  labels:
    - ci-failure
    - auto-generated
    - needs-fix

  # Title template (variables: {workflow}, {run_id}, {repo})
  title: "🔴 CI Failure: {workflow} #{run_id}"

  # Description template
  description: |
    ## Automated CI/CD Failure Detection

    **Workflow**: {workflow}
    **Run ID**: {run_id}
    **Repository**: {repo}
    **Branch**: {branch}
    **Triggered by**: {actor}
    **Timestamp**: {timestamp}

    ---

    ## Failure Summary

    {error_summary}

    ## Error Details

    **Error Types Detected**:
    {error_types}

    **Failed Jobs**:
    {failed_jobs}

    **Files Potentially Affected**:
    {affected_files}

    ---

    ## Auto-Fix Status

    {autofix_status}

    ## Actions Taken

    - [x] Failure detected and analyzed
    - [x] Linear issue created automatically
    - [ ] Codegen AI fix in progress
    - [ ] Pull request created with fix
    - [ ] Tests passed
    - [ ] Ready for merge

    ---

    ## Links

    - **Workflow Run**: {workflow_url}
    - **Logs**: {logs_url}
    - **Codegen Task**: {codegen_url}
    - **Fix PR**: {pr_url}

    ---

    *🤖 This issue was automatically created by the Self-Healing CI/CD system*
    *⚡️ Powered by Codegen AI Agent*

# Automation rules
automation:
  # Auto-assign to team
  assign_team: true
  team_name: "Engineering"

  # Auto-transition states
  state_transitions:
    - from: "Triage"
      to: "In Progress"
      when: "codegen_task_created"

    - from: "In Progress"
      to: "Ready for Review"
      when: "pr_created"

    - from: "Ready for Review"
      to: "Done"
      when: "pr_merged"

  # Auto-close conditions
  auto_close:
    enabled: true
    conditions:
      - pr_merged: true
      - workflow_success: true
    comment: "✅ Auto-resolved: Fix merged and CI passing"

  # Notifications
  notifications:
    slack:
      enabled: true
      channel: "#ci-alerts"
      mention_on_failure: true

    email:
      enabled: false

# SLA tracking
sla:
  time_to_detect: "5 minutes"
  time_to_fix: "2 hours"
  time_to_resolve: "4 hours"
