# Linear Issue Template: Sentry Error
# Auto-created by webhook orchestrator

name: Sentry Error/Exception
description: Automated issue creation for production errors detected by Sentry

# Issue fields
issue:
  priority: 1  # Urgent for errors, 2 for warnings
  labels:
    - sentry-error
    - auto-generated
    - production-bug

  # Title template
  title: "🐛 {error_type}: {error_message}"

  # Description template
  description: |
    ## Production Error Detected

    **Error Type**: {error_type}
    **Environment**: {environment}
    **Release**: {release}
    **Platform**: {platform}
    **Timestamp**: {timestamp}
    **First Seen**: {first_seen}
    **Last Seen**: {last_seen}
    **Event Count**: {event_count}
    **User Count**: {user_count}

    ---

    ## Error Message

    ```
    {error_message}
    ```

    ## Stack Trace

    ```{language}
    {stack_trace}
    ```

    ---

    ## Context

    **URL**: {request_url}
    **Method**: {request_method}
    **User Agent**: {user_agent}
    **User ID**: {user_id}

    ### Breadcrumbs

    {breadcrumbs}

    ### Tags

    {tags}

    ---

    ## Impact Analysis

    **Severity**: {severity}
    **Affected Users**: {user_count}
    **Occurrence Rate**: {event_count} events in {time_window}

    ---

    ## Auto-Fix Status

    - [x] Error detected in Sentry
    - [x] Linear issue created
    - [ ] Root cause analysis initiated
    - [ ] Fix generated by Codegen AI
    - [ ] Pull request created
    - [ ] Tests passing
    - [ ] Deployed and verified

    ---

    ## Links

    - **Sentry Issue**: {sentry_url}
    - **Codegen Task**: {codegen_url}
    - **Fix PR**: {pr_url}

    ---

    *🤖 Auto-created from Sentry webhook*
    *⚡️ Powered by Codegen AI Agent*

# Automation rules
automation:
  # Priority escalation
  priority_rules:
    - condition: "error_level == 'fatal'"
      priority: 0  # Critical

    - condition: "user_count > 100"
      priority: 0  # Critical

    - condition: "error_level == 'error'"
      priority: 1  # Urgent

    - condition: "error_level == 'warning'"
      priority: 2  # High

  # Auto-assign
  assign_team: true
  team_name: "Engineering"

  # Auto-assign to individual (based on git blame)
  assign_to_author: true

  # State transitions
  state_transitions:
    - from: "Backlog"
      to: "In Progress"
      when: "codegen_analysis_started"

    - from: "In Progress"
      to: "Ready for Review"
      when: "pr_created"

    - from: "Ready for Review"
      to: "Done"
      when: "pr_merged_and_sentry_resolved"

  # Auto-close with Sentry integration
  auto_close:
    enabled: true
    conditions:
      - pr_merged: true
      - sentry_issue_resolved: true
    comment: "✅ Auto-resolved: Fix deployed, Sentry issue resolved"

  # Duplicate detection
  duplicate_detection:
    enabled: true
    match_fields:
      - error_type
      - error_message
      - stack_trace_fingerprint
    action: "link_to_existing"

  # Notifications
  notifications:
    slack:
      enabled: true
      channel: "#prod-errors"
      mention: "@on-call"
      conditions:
        - error_level: "fatal"
        - user_count: "> 50"

    pagerduty:
      enabled: false
      severity: "high"

# Integration actions
integrations:
  sentry:
    # Auto-resolve in Sentry when Linear issue is closed
    sync_status: true

    # Add Linear issue link to Sentry
    add_link: true

  github:
    # Create branch from issue
    auto_create_branch: true
    branch_prefix: "fix/sentry"

  codegen:
    # Trigger auto-fix
    auto_trigger: true
    prompt_template: |
      Analyze and fix this Sentry error:

      Error: {error_message}
      Stack trace: {stack_trace}

      Context: {breadcrumbs}

      Generate a production-ready fix with:
      1. Root cause analysis
      2. Code fix
      3. Tests to prevent regression
      4. Error handling improvements

# SLA tracking
sla:
  critical: "1 hour"    # For fatal errors
  high: "4 hours"       # For errors affecting >100 users
  normal: "24 hours"    # For regular errors
  low: "1 week"         # For warnings
